{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="empty-state card error-card">
      <h1>404 - Page Not Found</h1>
      <p class="muted">The page you are looking for does not exist, or the record was deleted.</p>
      <div class="hero-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Homepage</a>
        <a href="{{ url_for('public_shows') }}" class="btn btn-outline">Browse Shows</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
