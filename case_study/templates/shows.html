{% extends "base.html" %}
{% block title %}Shows - CBMS{% endblock %}

{% block content %}
<h1>All Shows</h1>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Agency</th>
            <th>Genre</th>
            <th>Duration (min)</th>
        </tr>
    </thead>
    <tbody>
        {% for show in shows %}
        <tr>
            <td>{{ show.show_id }}</td>
            <td>{{ show.title }}</td>
            <td>{{ show.agency_name }}</td>
            <td>{{ show.genre_name }}</td>
            <td>{{ show.duration_minutes }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
